name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stonecutter needs Gradle on Java 21; the 1.20.1 node compiles with the Java 17 toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test core logic
        run: ./gradlew :core:test

      - name: Build every Minecraft version
        run: ./gradlew build

      # Boots a headless server per version and runs the mod's in-world game tests.
      - name: Game tests (1.21.1 NeoForge)
        run: ./gradlew :1.21.1-neoforge:runGameTestServer

      - name: Game tests (1.20.1 Forge)
        run: ./gradlew :1.20.1-forge:runGameTestServer

      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: versions/*/build/libs/*.jar
